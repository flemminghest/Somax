.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5679df,#86a1ef)}.topic-actions{display:flex;gap:7px}.iconbtn{width:42px;height:42px;border-radius:12px;background:#f2f4f8;color:#596579;font-size:18px;flex:none}.accordion-panel{max-height:0;opacity:0;transform:translateY(-10px);overflow:hidden;transition:max-height .55s cubic-bezier(.2,.75,.25,1),opacity .32s ease,transform .42s ease}.accordion-panel.open{max-height:5000px;opacity:1;transform:translateY(0)}.accordion-content{border-top:1px solid #e8ecf3;margin-top:18px;padding-top:17px}.accordion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:15px}.task-list{display:grid;gap:12px}.task{display:flex;align-items:flex-start;gap:15px;padding:19px 20px;border:1px solid var(--line);border-radius:18px;background:#fff}.check{appearance:none;width:23px;height:23px;border:1.8px solid #aeb9cb;border-radius:7px;flex:none;margin:2px 0 0;cursor:pointer}.check:checked{background:#4268d5;border-color:#4268d5;position:relative}.check:checked:after{content:"✓";color:white;position:absolute;left:4px;top:-1px;font-size:16px}.task-main{flex:1;min-width:0}.task-title{font-weight:750;font-size:19px;line-height:1.4}.task.done .task-title{text-decoration:line-through;color:#8992a3}.task-desc{font-size:14px;color:#596579;margin-top:5px}.task-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:#f1f3f8;color:#536078}.status{border:1px solid #e1e6ef;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:700;min-width:142px;min-height:44px;transition:background .2s,border-color .2s,color .2s}.status-todo{background:#f1f3f7;border-color:#d9dee8;color:#566176}.status-doing{background:#eaf1ff;border-color:#b8ccff;color:#2452ad}.status-done{background:#e7f7ee;border-color:#a8dfbd;color:#167044}.status-blocked{background:#fff0ef;border-color:#f2b8b5;color:#b42318}.empty{padding:36px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd2df;border-radius:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{border:1px solid #e2e6ee;background:#fff;border-radius:12px;padding:10px 13px;min-width:200px;outline:none}.modal-back{position:fixed;inset:0;background:#11182775;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-back.open{display:flex}.modal{width:min(540px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0003;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal h3{margin:0;font-size:22px}.close{width:32px;height:32px;border-radius:10px;background:#f1f3f7;font-size:19px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:700;color:#465166}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4ec;border-radius:12px;padding:11px 12px;outline:none;background:#fff}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#6b88e4;box-shadow:0 0 0 3px #4268d51a}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:28px;height:28px;border-radius:9px;border:2px solid white;box-shadow:0 0 0 1px #ccd2df}.swatch.selected{box-shadow:0 0 0 2px #273e7c}.note{font-size:11px;color:#7b8495;margin-top:8px}footer{text-align:center;color:#8992a3;font-size:11px;margin:28px 0 0}@media(max-width:760px){.app{padding:18px 14px 40px}.brand h1{font-size:24px}.welcome h2{font-size:31px}.section-head h2{font-size:24px}.topic-name{font-size:21px}.topic-card{padding:20px 18px}.task{flex-wrap:wrap;padding:14px}.task-main{flex-basis:calc(100% - 42px)}.task .status{margin-left:38px;flex:1}.hero{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.top{align-items:flex-start}.top-actions </style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">S</div><div><h1>SOMAX Roadmap</h1><p>Projektplan · DK / EN · 1 produkt</p></div></div><button class="btn primary" onclick="openTask()">＋ Ny opgave</button></header><input id="globalSearch" class="global-search" type="search" placeholder="Søg i alle emner, opgaver, beskrivelser, ansvarlige og deadlines…" oninput="globalSearch(this.value)"><nav class="tabs"><button class="tab active" data-view="dashboard" onclick="setView('dashboard')">Overblik</button><button class="tab" data-view="roadmap" onclick="setView('roadmap')">Roadmap</button><button class="tab" data-view="topics" onclick="setView('topics')">Emner</button></nav><div id="appview"></div><footer>SOMAX Roadmap · Ændringer gemmes i denne browser</footer></div><div class="modal-back" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Ny opgave</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const colors=['#7ea8d8','#7d8de0','#d47fa7','#a889dc','#69b99d','#5fb7b0','#d4a64d','#df9365','#9aa6b7','#d27c9b','#71b78c','#8795a8'];
const seedTopics=[['Strategi & planlægning','Formål, målgruppe, scope og projektets retning.'],['Shopify & design','Grundopsætning, tema, navigation og sider.'],['Produkt & indhold','Produktside, produkttekster, billeder og YouTube.'],['Dansk & engelsk','Sprogversionering og kvalitetssikring af indhold.'],['Betaling & checkout','Betalingsmetoder, checkout og ordrebekræftelser.'],['Forsendelse & levering','Fragtregler, fragtintegration og returflow.'],['Google & tracking','GA4, GTM, Search Console, Merchant Center og Ads.'],['SEO & GEO','Søgemaskineoptimering og synlighed i AI-søgning.'],['GDPR & cookies','Privatliv, cookies, samtykke og Consent Mode.'],['Performance & CRO','Hastighed, mobiloplevelse og konvertering.'],['Test & lancering','Kvalitetstest, testordre og go-live.'],['Efter lancering','Opfølgning, analyse og løbende optimering.']];
const seedTasks=[
['Strategi & planlægning','Afklar formål og målgruppe','Formål, målgruppe, USP’er og primære konverteringsmål.'],['Strategi & planlægning','Fastlæg sitemap','Forside, produktside, Om os, FAQ, Kontakt og juridiske sider.'],['Strategi & planlægning','Klargør produktmateriale','Produktnavn, pris, varianter, billeder, specifikationer og fordele.'],['Strategi & planlægning','Afklar markeder','Danmark som primært marked; afklar øvrige engelsksprogede markeder.'],
['Shopify & design','Opret Shopify og vælg abonnement','Opret konto, butiksnavn og relevant abonnement.'],['Shopify & design','Tilknyt domæne og SSL','DNS, domæneforbindelse og sikker HTTPS.'],['Shopify & design','Vælg og tilpas tema','Responsivt tema, farver, typografi og visuel identitet.'],['Shopify & design','Byg navigation og footer','Header, menupunkter, footer og juridiske links.'],['Shopify & design','Byg undersiderne','Forside, produkt, Om os, FAQ, Kontakt samt lovpligtige sider.'],
['Produkt & indhold','Opsæt produktsiden','Beskrivelse, pris, billeder, varianter, lagerstatus og købsknap.'],['Produkt & indhold','Tilføj tillidsskabende indhold','USP’er, levering, retur, anmeldelser og relevante garantier.'],['Produkt & indhold','Integrér YouTube-videoer','Indlejr videoer fra egen kanal med responsiv visning og samtykke.'],['Produkt & indhold','Klargør FAQ','Spørgsmål om produkt, brug, levering, betaling og retur.'],
['Dansk & engelsk','Opsæt dansk og engelsk','Shopify Translate & Adapt eller tilsvarende.'],['Dansk & engelsk','Oversæt alt indhold','Sider, produkt, navigation, knapper, systemtekster og e-mails.'],['Dansk & engelsk','Kontrollér sprog-SEO','Separate metadata, URL’er og hreflang.'],
['Betaling & checkout','Aktivér betalingsmetoder','Shopify Payments hvor muligt, kort, MobilePay og wallets efter behov.'],['Betaling & checkout','Konfigurér checkout','Kundeoplysninger, ordrebekræftelse og e-mailnotifikationer.'],['Betaling & checkout','Test betaling','Testkøb samt fejlede og annullerede betalinger.'],
['Forsendelse & levering','Definér fragtregler','Leveringsområder, fragtpriser, gratis fragt og leveringstider.'],['Forsendelse & levering','Vælg fragtintegration','Afklar GLS, PostNord, DAO eller anden leverandør.'],['Forsendelse & levering','Test leveringsflow','Fragtlabel, trackingnummer, beskeder og returproces.'],
['Google & tracking','Opsæt GA4','Property, datastrøm og ecommerce-events.'],['Google & tracking','Opsæt Google Tag Manager','Container, tags, triggers og datalag efter behov.'],['Google & tracking','Validér ecommerce tracking','view_item, add_to_cart, begin_checkout, purchase og undgå dobbeltmåling.'],['Google & tracking','Opsæt Search Console','Domæneverifikation, sitemap og indekseringskontrol.'],['Google & tracking','Opsæt Merchant Center','Produktfeed, fragt, returvilkår og produktgodkendelser.'],['Google & tracking','Klargør Google Ads','Konverteringsmåling og remarketing efter behov.'],
['SEO & GEO','Optimér on-page SEO','Søgeord, sidetitler, meta descriptions, overskrifter og ALT-tekster.'],['SEO & GEO','Kontrollér teknisk SEO','Canonical, hreflang, sitemap, robots.txt og indeksering.'],['SEO & GEO','Implementér strukturerede data','Product, Organization og relevante øvrige schema-typer.'],['SEO & GEO','Gør indhold AI-venligt (GEO)','Klare produktfakta, FAQ, entiteter, kilder og konsistente branddata.'],['SEO & GEO','Kontrollér crawlbarhed','Undgå utilsigtet blokering af relevante søge- og AI-crawlere.'],
['GDPR & cookies','Udarbejd juridiske sider','Privatlivspolitik, handelsbetingelser, retur- og reklamationspolitik.'],['GDPR & cookies','Opsæt samtykkeløsning','CMP, cookie-banner og samtykkestyring.'],['GDPR & cookies','Konfigurér Consent Mode v2','Sørg for at tags respekterer brugerens samtykke.'],['GDPR & cookies','Test tredjepartsindhold','Kontrollér YouTube, analytics og marketingcookies.'],
['Performance & CRO','Optimér hastighed','Billeder, lazy loading, apps og Core Web Vitals.'],['Performance & CRO','Optimér købsoplevelsen','Tydelig CTA, levering, retur, pris og enkel checkout.'],['Performance & CRO','Test mobil og desktop','Kontrollér layout, læsbarhed og funktioner på skærmstørrelser.'],
['Test & lancering','Gennemfør funktionstest','Links, sider, sprogskift, videoer, formularer og navigation.'],['Test & lancering','Gennemfør testordre','Test produkt, betaling, fragt, e-mails og ordrestatus.'],['Test & lancering','Validér tracking og samtykke','GA4, GTM, Ads, Consent Mode og event-deduplikering.'],['Test & lancering','Go-live','Domæne, SSL, fjern password, sitemap og endelig godkendelse.'],
['Efter lancering','Følg op de første 14 dage','Ordrer, betalinger, fragt, tracking og tekniske fejl.'],['Efter lancering','Etablér månedlig optimering','GA4, konverteringsrate, SEO, GEO og produktperformance.']];
const STORE='somax-roadmap-v1';let data;try{data=JSON.parse(localStorage.getItem(STORE))}catch(e){}if(!data||!Array.isArray(data.topics)||!Array.isArray(data.tasks))data={topics:seedTopics.map((x,i)=>({id:'t'+i,name:x[0],desc:x[1],color:colors[i%colors.length]})),tasks:seedTasks.map((x,i)=>({id:'a'+i,topicId:'t'+seedTopics.findIndex(t=>t[0]===x[0]),title:x[1],desc:x[2],status:'todo',owner:'',due:''}))};
// Recovery: restore the Shopify & design topic and its original five tasks if deleted.
(function restoreShopifyDesign(){
  let t = data.topics.find(x => x.name === 'Shopify & design');
  if (!t) {
    t = {id:'t_shopify_design_restore',name:'Shopify & design',desc:'Grundopsætning, tema, navigation og sider.',color:'#7d8de0'};
    data.topics.splice(Math.min(1,data.topics.length),0,t);
  }
  const restored = [
    ['Opret Shopify og vælg abonnement','Opret konto, butiksnavn og relevant abonnement.'],
    ['Tilknyt domæne og SSL','DNS, domæneforbindelse og sikker HTTPS.'],
    ['Vælg og tilpas tema','Responsivt tema, farver, typografi og visuel identitet.'],
    ['Byg navigation og footer','Header, menupunkter, footer og juridiske links.'],
    ['Byg undersiderne','Forside, produkt, Om os, FAQ, Kontakt samt lovpligtige sider.']
  ];
  for (const [title,desc] of restored) {
    if (!data.tasks.some(x => x.topicId === t.id && x.title === title)) {
      data.tasks.push({id:'restore_shopify_'+restored.indexOf(restored.find(x=>x[0]===title)),topicId:t.id,title,desc,status:'todo',owner:'',due:''});
    }
  }
  save();
})();
function save(){localStorage.setItem(STORE,JSON.stringify(data))}let view='dashboard';let expanded=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const topic=id=>data.topics.find(t=>t.id===id);const completed=()=>data.tasks.filter(t=>t.status==='done').length;const progress=()=>data.tasks.length?Math.round(completed()/data.tasks.length*100):0;
function setView(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function render(){let el=document.getElementById('appview');el.innerHTML=view==='dashboard'?dashboard():view==='topics'?topicsView():roadmapView();requestAnimationFrame(()=>el.querySelectorAll('.accordion-panel[data-expanded="true"]').forEach(x=>x.classList.add('open')))}
function dashboard(){let p=progress(),left=data.tasks.length-completed();return `<div class="hero"><section class="welcome"><div class="eyebrow">Projektoversigt · Shopify</div><h2>Få overblik.<br>Skab fremdrift.</h2><p>Din samlede plan for en enkel Shopify-løsning med ét produkt, to sprog og de vigtigste integrationer.</p></section><section class="progress-card"><div><h3>Samlet fremdrift</h3><p>${completed()} af ${data.tasks.length} opgaver gennemført</p></div><div class="ring" style="--progress:${p}%"><div><strong>${p}%</strong><span>FÆRDIG</span></div></div></section></div><div class="stats"><div class="stat"><label>Alle opgaver</label><strong>${data.tasks.length}</strong></div><div class="stat"><label>Færdige</label><strong>${completed()}</strong></div><div class="stat"><label>Mangler</label><strong>${left}</strong></div></div><div class="section-head"><div><h2>Emner</h2><p>Vælg et emne for at se og opdatere opgaverne.</p></div><button class="btn primary" onclick="topicForm()">＋ Nyt emne</button></div><div class="topic-grid">${data.topics.map(topicCard).join('')||'<div class="empty">Opret dit første emne.</div>'}</div>`}
function topicCard(t){let tasks=data.tasks.filter(x=>x.topicId===t.id),d=tasks.filter(x=>x.status==='done').length,p=tasks.length?Math.round(d/tasks.length*100):0,open=expanded.has(t.id);return `<article class="topic-card"><div class="topic-top"><div class="topic-name"><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</div><div class="topic-actions"><button class="iconbtn" onclick="topicForm('${t.id}')" title="Redigér">✎</button><button class="iconbtn" onclick="deleteTopic('${t.id}')" title="Slet">×</button></div></div><div class="topic-desc">${esc(t.desc||'Ingen beskrivelse tilføjet.')}</div><div class="topic-meta"><span>${d} / ${tasks.length} opgaver</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div><div style="display:flex;justify-content:flex-end;margin-top:13px"><button class="btn soft small" onclick="toggleAccordion('${t.id}')">${open?'Skjul opgaver ↑':'Se opgaver ↓'}</button></div><div class="accordion-panel" data-expanded="${open}"><div class="accordion-content"><div class="accordion-head"><b>Opgaver i ${esc(t.name)}</b><button class="btn primary small" onclick="taskForm(null,'${t.id}')">＋ Tilføj opgave</button></div><div class="task-list">${tasks.map(taskCard).join('')||'<div class="empty">Ingen opgaver i dette emne endnu.</div>'}</div></div></div></article>`}
function topicsView(){return `<div class="section-head"><div><h2>Emner</h2><p>Opret, redigér eller slet emner.</p></div><button class="btn primary" onclick="topicForm()">＋ Opret emne</button></div><div class="topic-grid">${data.topics.map(topicCard).join('')}</div>`}
function roadmapView(){return `<div class="section-head"><div><h2>Roadmap</h2><p>Alle opgaver fordelt på emner.</p></div><button class="btn primary" onclick="taskForm()">＋ Ny opgave</button></div>${data.topics.map(t=>`<h2 style="font-size:23px;margin:25px 2px 12px">${esc(t.name)}</h2><div class="task-list">${data.tasks.filter(x=>x.topicId===t.id).map(taskCard).join('')}</div>`).join('')}`}
function taskCard(t){let labels={todo:'Ikke startet',doing:'I gang',done:'Færdig',blocked:'Blokeret'};return `<article class="task ${t.status==='done'?'done':''}"><input class="check" type="checkbox" ${t.status==='done'?'checked':''} onchange="changeStatus('${t.id}',this.checked?'done':'todo')"><div class="task-main"><div class="task-title">${esc(t.title)}</div>${t.desc?`<div class="task-desc">${esc(t.desc)}</div>`:''}<div class="task-meta"><span class="pill">${esc(topic(t.topicId)?.name||'Uden emne')}</span>${t.owner?`<span class="pill">Ansvarlig: ${esc(t.owner)}</span>`:''}${t.due?`<span class="pill">${esc(t.due)}</span>`:''}</div></div><select class="status status-${t.status}" onchange="changeStatus('${t.id}',this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select><button class="iconbtn" onclick="taskForm('${t.id}')">✎</button><button class="iconbtn" onclick="deleteTask('${t.id}')">×</button></article>`}
function toggleAccordion(id){let card=[...document.querySelectorAll('.topic-card')].find(x=>x.querySelector(`[onclick="toggleAccordion('${id}')"]`));if(!card)return;let panel=card.querySelector('.accordion-panel'),button=card.querySelector(`[onclick="toggleAccordion('${id}')"]`);if(expanded.has(id)){expanded.delete(id);panel.classList.remove('open');panel.dataset.expanded='false';button.textContent='Se opgaver ↓'}else{expanded.add(id);panel.dataset.expanded='true';requestAnimationFrame(()=>panel.classList.add('open'));button.textContent='Skjul opgaver ↑'}}
function changeStatus(id,status){let t=data.tasks.find(x=>x.id===id);t.status=status;save();render()}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function topicForm(id=''){let t=topic(id),chosen=t?.color||colors[data.topics.length%colors.length];showModal(t?'Redigér emne':'Opret emne',`<form onsubmit="saveTopic(event,'${id}')"><div class="field"><label>Emne</label><input name="name" required value="${esc(t?.name||'')}" placeholder="Skriv emnets navn"></div><div class="field"><label>Brødtekst (valgfri)</label><textarea name="desc">${esc(t?.desc||'')}</textarea></div><div class="field"><label>Farve</label><input name="color" type="color" value="${chosen}"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annullér</button><button class="btn primary">Gem</button></div></form>`)}
function saveTopic(e,id){e.preventDefault();let f=new FormData(e.target),obj={name:f.get('name').trim(),desc:f.get('desc').trim(),color:f.get('color')};if(id)Object.assign(topic(id),obj);else data.topics.push({id:'t'+Date.now(),...obj});save();closeModal();render()}
function deleteTopic(id){let t=topic(id),n=data.tasks.filter(x=>x.topicId===id).length;if(!confirm(`Slet emnet "${t.name}"? ${n} opgaver vil også blive slettet.`))return;data.tasks=data.tasks.filter(x=>x.topicId!==id);data.topics=data.topics.filter(x=>x.id!==id);save();render()}
function taskForm(id='',pre=''){let t=id?data.tasks.find(x=>x.id===id):null;if(!data.topics.length){alert('Opret et emne først.');return}showModal(t?'Redigér opgave':'Ny opgave',`<form onsubmit="saveTask(event,'${id}')"><div class="field"><label>Opgave</label><input name="title" required value="${esc(t?.title||'')}"></div><div class="field"><label>Beskrivelse</label><textarea name="desc">${esc(t?.desc||'')}</textarea></div><div class="field"><label>Emne</label><select name="topicId">${data.topics.map(x=>`<option value="${x.id}" ${(t?.topicId||pre)===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${[['todo','Ikke startet'],['doing','I gang'],['done','Færdig'],['blocked','Blokeret']].map(([v,l])=>`<option value="${v}" ${t?.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Ansvarlig</label><input name="owner" value="${esc(t?.owner||'')}"></div><div class="field"><label>Deadline</label><input type="date" name="due" value="${esc(t?.due||'')}"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annullér</button><button class="btn primary">Gem</button></div></form>`)}
function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),obj={title:f.get('title').trim(),desc:f.get('desc').trim(),topicId:f.get('topicId'),status:f.get('status'),owner:f.get('owner').trim(),due:f.get('due')};if(id)Object.assign(data.tasks.find(x=>x.id===id),obj);else data.tasks.push({id:'a'+Date.now(),...obj});save();closeModal();render()}
function deleteTask(id){let t=data.tasks.find(x=>x.id===id);showModal('Slet opgave?',`<p>Er du sikker på, at du vil slette denne opgave?</p><p><b>${esc(t.title)}</b></p><p class="note">Handlingen kan ikke fortrydes.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Annullér</button><button class="btn danger" onclick="confirmDelete('${id}')">Ja, slet opgaven</button></div>`)}function confirmDelete(id){data.tasks=data.tasks.filter(x=>x.id!==id);save();closeModal();render()}
function globalSearch(q){let query=q.trim().toLowerCase();if(!query){document.getElementById('searchResults')?.remove();return}let found=data.tasks.filter(t=>[t.title,t.desc,t.owner,t.due,t.status,topic(t.topicId)?.name,topic(t.topicId)?.desc].join(' ').toLowerCase().includes(query));let el=document.getElementById('searchResults');if(!el){el=document.createElement('section');el.id='searchResults';document.querySelector('.tabs').after(el)}el.innerHTML=`<div class="section-head"><h2>Søgeresultater (${found.length})</h2></div><div class="task-list">${found.map(taskCard).join('')||'<div class="empty">Ingen resultater.</div>'}</div>`}
render();
</script></body></html>
